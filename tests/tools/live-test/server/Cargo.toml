# SPDX-License-Identifier: Apache-2.0
# Test harness for Studio Live's session server. Builds desktop-shell/src-tauri/src/live/ on its own (no Tauri), so the
# server can run headless for the Node tests (tools/live-test/*.mjs) and its unit tests run with `cargo test`.
# Site-only helper: the module path below assumes the deploy layout /var/www/CADCRAFT/{getcadcraft.com,desktop-shell}.
[package]
name = "cc-live-harness"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "live-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
# crypto.rs (session live-relay, LV.4)
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
